services:
  - type: web
    name: event-reservation-system
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan storage:link
      php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://event-reservation-system.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: event-reservation-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: event-reservation-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: event-reservation-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: event-reservation-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: event-reservation-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: event-reservation-db
    databaseName: event_reservation
    plan: free
